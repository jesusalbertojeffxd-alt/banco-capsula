<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - CapsulaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <style>
        .btn-eliminar-gamer {
            background: #ff1744;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-eliminar-gamer:hover {
            background: #d50000;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
        }
        .acciones-col {
            min-width: 120px;
        }
        .table-gamer th {
            background: #1a1a1a;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }
        .table-gamer td {
            vertical-align: middle;
        }
        .table-gamer tr:hover {
            background: #1a1a1a;
        }
        .alert-gamer {
            background: #1a1a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .alert-gamer-danger {
            border-color: #ff1744;
            color: #ff1744;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-capsule sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/admin/dashboard">
                <span class="capsule-logo">C</span>
                CapsulaBank
                <span class="capsule-badge" style="background: #ff1744;">ADMIN</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard"><i class="bi bi-house-fill"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/clientes"><i class="bi bi-people-fill"></i> Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/creditos"><i class="bi bi-credit-card"></i> Creditos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/cuentas"><i class="bi bi-bank"></i> Cuentas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/movimientos"><i class="bi bi-arrow-left-right"></i> Movimientos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/perfil"><i class="bi bi-person-circle"></i> Mi Perfil</a>
                    </li>
                    
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle" style="color: #ff1744;"></i> 
                            <span>Administrador</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" style="background: #0a0a0a; border: 1px solid rgba(255, 23, 68, 0.3); border-radius: 12px;">
                            <li>
                                <form action="/logout" method="post">
                                    <button type="submit" class="dropdown-item text-danger fw-bold">
                                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesion
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-white">
                <i class="bi bi-people-fill text-info me-2"></i>
                Clientes Registrados
            </h1>
            <span class="badge bg-info text-dark fs-6" th:text="${clientes.size()} + ' clientes'">0 clientes</span>
        </div>

        <div th:if="${success}" class="alert alert-gamer" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-gamer alert-gamer-danger" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
        </div>

        <div class="card bg-dark border-0 shadow-lg">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 table-gamer">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th><i class="bi bi-person"></i> Nombre</th>
                                <th><i class="bi bi-person-badge"></i> Usuario</th>
                                <th><i class="bi bi-shield-check"></i> Rol</th>
                                <th><i class="bi bi-check-circle"></i> Estado</th>
                                <th><i class="bi bi-bank"></i> Cuentas</th>
                                <th class="acciones-col"><i class="bi bi-gear"></i> Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.id}">1</td>
                                <td th:text="${cliente.nombre}">Nombre</td>
                                <td th:text="${cliente.username}">@username</td>
                                <td>
                                    <span class="badge" style="background: #00ff88; color: black;">
                                        <i class="bi bi-person-check me-1"></i> CLIENTE
                                    </span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:if="${cliente.activo}">
                                        <i class="bi bi-check-circle-fill me-1"></i> ACTIVO
                                    </span>
                                    <span class="badge bg-danger" th:unless="${cliente.activo}">
                                        <i class="bi bi-x-circle-fill me-1"></i> INACTIVO
                                    </span>
                                </td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${cliente.cuentas != null ? cliente.cuentas.size() : 0}">0</span>
                                </td>
                                <td>
                                    <!-- ✅ FORMULARIO CON CSRF -->
                                    <form action="#" th:action="@{/admin/clientes/{id}/eliminar(id=${cliente.id})}" method="post" style="display: inline;" 
                                          onsubmit="return confirmarEliminacion(event, '${cliente.nombre}')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn-eliminar-gamer">
                                            <i class="bi bi-trash3"></i> ELIMINAR
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${clientes.isEmpty()}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox display-1 d-block mb-3"></i>
                                    No hay clientes registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-capsule mt-5">
        <div class="container">
            <div class="footer-bottom">
                <span><i class="bi bi-c-circle"></i> 2026 CapsulaBank</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmarEliminacion(event, nombre) {
            event.preventDefault();
            if (confirm('¿Seguro que deseas eliminar al cliente "' + nombre + '"? Se eliminaran todas sus cuentas y movimientos.')) {
                if (confirm('Ultima confirmacion: ¿Realmente deseas continuar?')) {
                    event.target.submit();
                }
            }
            return false;
        }
    </script>
</body>
</html>
