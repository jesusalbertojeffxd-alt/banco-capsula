<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - CapsulaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <style>
        .perfil-gamer {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 40px 0;
        }
        .perfil-card {
            background: #111;
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.1);
        }
        .perfil-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00ff88;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            background: #1a1a1a;
        }
        .perfil-avatar-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00ff88;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-size: 60px;
            color: #00ff88;
        }
        .perfil-nombre {
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .perfil-username {
            color: #ff00ff;
            font-size: 16px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }
        .perfil-info {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 15px 0;
            border-left: 3px solid #00ff88;
        }
        .perfil-info-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .perfil-info-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-subir-imagen {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            width: 100%;
        }
        .btn-subir-imagen:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .input-file-hidden {
            display: none;
        }
        .btn-volver {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .btn-volver:hover {
            background: #00ff88;
            color: #000;
            transform: scale(1.02);
        }
        /* ✅ NUEVO: Botón para cliente */
        .btn-volver-cliente {
            background: transparent;
            border: 2px solid #ff1744;
            color: #ff1744;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .btn-volver-cliente:hover {
            background: #ff1744;
            color: #fff;
            transform: scale(1.02);
        }
        .alert-gamer {
            background: #1a1a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 10px;
            padding: 15px;
        }
        .alert-gamer-danger {
            border-color: #ff1744;
            color: #ff1744;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #00ff88;
            color: #000;
        }
        /* ✅ NUEVO: Navbar para perfil */
        .navbar-capsule {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.05);
            padding: 12px 0;
        }
        .capsule-logo {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: 900;
            font-size: 22px;
            color: #0a0a0a;
            margin-right: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: #ffffff !important;
            letter-spacing: -0.5px;
        }
        .capsule-badge {
            background: linear-gradient(90deg, #00ff88, #00ccff);
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            color: #0a0a0a;
            font-weight: 700;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7) !important;
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            color: #00ff88 !important;
            background: rgba(0, 255, 136, 0.08);
        }
        .footer-capsule {
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding: 40px 0 20px;
            margin-top: 40px;
        }
        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 20px;
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
        }
        .heart {
            color: #ff1744;
            display: inline-block;
            animation: latido 1.5s ease-in-out infinite;
        }
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .dropdown-menu {
            background: #0a0a0a;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
            padding: 8px 0;
            min-width: 220px;
        }
        .dropdown-item {
            color: #fff;
        }
        .dropdown-item:hover {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }
        .dropdown-divider {
            border-color: rgba(0, 255, 136, 0.2);
            margin: 5px 15px;
        }
    </style>
</head>
<body>

    <!-- ✅ NAVBAR PARA PERFIL -->
    <nav class="navbar navbar-expand-lg navbar-capsule sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#" th:href="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN' ? '/admin/dashboard' : '/dashboard'}">
                <span class="capsule-logo">C</span>
                CapsulaBank
                <span class="capsule-badge" th:if="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN'}" style="background: #ff1744;">ADMIN</span>
                <span class="capsule-badge" th:unless="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN'}">FUTURE</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN' ? '/admin/dashboard' : '/dashboard'}">
                            <i class="bi bi-house-fill"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/perfil">
                            <i class="bi bi-person-circle" style="color: #00ff88;"></i> Mi Perfil
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle" style="color: #00ff88;"></i> 
                            <span th:text="${usuario.username}">Usuario</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <span class="dropdown-item-text text-white small" style="padding: 10px 20px; color: #e0e0e0;">
                                    <i class="bi bi-person-badge" style="color: #00ff88;"></i> 
                                    <span class="badge" style="background: #00ff88; color: #000; font-weight: bold;" th:text="${usuario.rol}">CLIENTE</span>
                                </span>
                            </li>
                            <li><hr class="dropdown-divider" /></li>
                            <li>
                                <form action="/logout" method="post" style="display: inline; width: 100%;">
                                    <button type="submit" class="dropdown-item text-danger fw-bold" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                                        <i class="bi bi-box-arrow-right" style="color: #ff1744; margin-right: 10px;"></i> Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="perfil-gamer">
        <div class="perfil-card">
            
            <div th:if="${success}" class="alert alert-gamer" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-gamer alert-gamer-danger" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
            </div>

            <!-- Avatar -->
            <div th:if="${usuario.fotoPerfil != null}">
                <img th:src="${usuario.fotoPerfil}" class="perfil-avatar" alt="Avatar"/>
            </div>
            <div th:unless="${usuario.fotoPerfil != null}" class="perfil-avatar-placeholder">
                <i class="bi bi-person-circle"></i>
            </div>

            <!-- Nombre y Username -->
            <div class="perfil-nombre" th:text="${usuario.nombre}">Usuario</div>
            <div class="perfil-username mb-3">
                <i class="bi bi-person-badge"></i> @<span th:text="${usuario.username}">username</span>
            </div>

            <!-- Formulario para subir imagen -->
            <form action="/perfil/actualizar-imagen" method="post" enctype="multipart/form-data" class="mb-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label for="imagen" class="btn-subir-imagen">
                    <i class="bi bi-cloud-upload"></i> CAMBIAR AVATAR
                </label>
                <input type="file" id="imagen" name="imagen" class="input-file-hidden" accept="image/*" 
                       onchange="this.form.submit()">
            </form>

            <!-- Información del usuario -->
            <div class="perfil-info">
                <div class="perfil-info-label"><i class="bi bi-person"></i> NOMBRE COMPLETO</div>
                <div class="perfil-info-value" th:text="${usuario.nombre}">Nombre Apellido</div>
            </div>

            <div class="perfil-info" style="border-left-color: #ff00ff;">
                <div class="perfil-info-label"><i class="bi bi-person-badge"></i> USUARIO</div>
                <div class="perfil-info-value" style="color: #ff00ff;" th:text="${'@' + usuario.username}">@username</div>
            </div>

            <div class="perfil-info">
                <div class="perfil-info-label"><i class="bi bi-shield-check"></i> ROL</div>
                <div class="perfil-info-value">
                    <span class="status-badge" th:text="${usuario.rol}">ADMIN</span>
                </div>
            </div>

            <div class="perfil-info">
                <div class="perfil-info-label"><i class="bi bi-check-circle"></i> ESTADO</div>
                <div class="perfil-info-value">
                    <span th:if="${usuario.activo}" class="text-success">ACTIVO</span>
                    <span th:unless="${usuario.activo}" class="text-danger">INACTIVO</span>
                </div>
            </div>

            <!-- ✅ BOTÓN VOLVER SEGÚN ROL -->
            <a th:if="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN'}" 
               href="/admin/dashboard" class="btn-volver mt-3">
                <i class="bi bi-arrow-left"></i> VOLVER AL DASHBOARD ADMIN
            </a>
            <a th:unless="${usuario.rol == 'EJECUTIVO' or usuario.rol == 'ADMIN'}" 
               href="/dashboard" class="btn-volver-cliente mt-3">
                <i class="bi bi-arrow-left"></i> VOLVER AL DASHBOARD
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-capsule">
        <div class="container">
            <div class="footer-bottom">
                <span><i class="bi bi-c-circle"></i> 2026 CapsulaBank. Hecho con <span class="heart">♥</span> para el futuro financiero.</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
